<script>
// Version check — รอล้าง cache + ถอน service worker ให้เสร็จก่อนค่อย reload (กัน bundle เก่าค้าง)
var APP_VERSION = "20260615-1781501214";
var lastVer = localStorage.getItem("app_ver");
if(lastVer !== APP_VERSION){
  localStorage.setItem("app_ver", APP_VERSION);
  var _clrCaches = (window.caches&&caches.keys)
    ? caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).catch(function(){})
    : Promise.resolve();
  var _clrSW = (navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
    ? navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(function(){})
    : Promise.resolve();
  if(lastVer){
    Promise.all([_clrCaches,_clrSW]).then(function(){location.reload(true)});
  }
}
</script>
