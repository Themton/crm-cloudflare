<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Supabase → D1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;padding:24px}
.wrap{max-width:750px;margin:0 auto}
h1{color:#3b82f6;font-size:22px;margin-bottom:8px}
.sub{color:#94a3b8;font-size:14px;margin-bottom:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;color:#f59e0b}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px;font-weight:600}
.field input{width:100%;background:#334155;color:#f1f5f9;border:1px solid #475569;border-radius:6px;padding:10px 14px;font-size:14px;outline:none}
.field input:focus{border-color:#3b82f6}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:#2563eb;color:#fff}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-green{background:#059669;color:#fff}
.btn-amber{background:#d97706;color:#fff}
.log{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;max-height:500px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.6;margin-top:12px}
.log .ok{color:#10b981}.log .err{color:#ef4444}.log .info{color:#3b82f6}.log .warn{color:#f59e0b}
.progress{background:#334155;border-radius:6px;height:8px;margin:12px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#8b5cf6);border-radius:6px;transition:width .3s;width:0}
</style>
</head>
<body>
<div class="wrap">
<h1>🔄 Sync Supabase → D1</h1>
<p class="sub">ซิงค์ข้อมูลจาก Supabase เดิม มายัง Cloudflare D1</p>

<div class="card">
<h3>⚙️ การเชื่อมต่อ</h3>
<div class="field"><label>Supabase URL</label><input id="sb-url" value="https://sfwbzcrvesbeymvlsxsu.supabase.co"></div>
<div class="field"><label>Supabase Anon Key</label><input id="sb-key" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmd2J6Y3J2ZXNiZXltdmxzeHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTMzNTgsImV4cCI6MjA4ODkyOTM1OH0.E4Zvq43f0M29hAZzKg78W9HRpthv0I9U37LDo_0Pyvo"></div>
<div class="field"><label>D1 Worker URL</label><input id="cf-url" value="https://crm-themt-api.themtja.workers.dev"></div>
<div class="field"><label>D1 Key (same key)</label><input id="cf-key" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmd2J6Y3J2ZXNiZXltdmxzeHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTMzNTgsImV4cCI6MjA4ODkyOTM1OH0.E4Zvq43f0M29hAZzKg78W9HRpthv0I9U37LDo_0Pyvo"></div>
</div>

<div class="btns">
<button class="btn btn-blue" onclick="checkAll()">🔍 ตรวจสอบข้อมูล</button>
<button class="btn btn-purple" onclick="syncFlashStatus()">🚚 ซิงค์สถานะ Flash</button>
<button class="btn btn-amber" onclick="syncMissingOrders()">📦 ซิงค์ Orders ที่หาย</button>
<button class="btn btn-green" onclick="syncEverything()">🔄 ซิงค์ทั้งหมด</button>
</div>

<div class="progress" id="pb-wrap" style="display:none"><div class="progress-bar" id="pb"></div></div>
<div class="log" id="log" style="display:none"></div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
function log(m,c){$('log').style.display='block';$('log').innerHTML+='<div class="'+(c||'')+'">'+ new Date().toLocaleTimeString()+' '+m+'</div>';$('log').scrollTop=1e6;}
function pb(p){$('pb-wrap').style.display='block';$('pb').style.width=Math.min(100,p)+'%';}
function cfg(){return{sbUrl:$('sb-url').value.trim().replace(/\/$/,''),sbKey:$('sb-key').value.trim(),cfUrl:$('cf-url').value.trim().replace(/\/$/,''),cfKey:$('cf-key').value.trim()};}
function hdr(key){return{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'};}

async function fetchAll(baseUrl,key,table){
  var all=[],page=0,sz=1000;
  while(true){
    var r=await fetch(baseUrl+'/rest/v1/'+table+'?select=*',{headers:Object.assign({},hdr(key),{Range:page*sz+'-'+(page*sz+sz-1)})});
    if(!r.ok){log('❌ '+table+': HTTP '+r.status,'err');return all;}
    var d=await r.json();if(!d||!d.length)break;
    all=all.concat(d);if(d.length<sz)break;page++;
  }
  return all;
}

// ============ ตรวจสอบ ============
async function checkAll(){
  var c=cfg();$('log').innerHTML='';
  log('🔍 กำลังตรวจสอบ...','info');pb(5);

  var tables=['orders','parcel_checks','accounts'];
  var bkeys={orders:'order_id',parcel_checks:'tracking_no',accounts:'username'};

  for(var i=0;i<tables.length;i++){
    var t=tables[i],bk=bkeys[t];
    log('📊 '+t+' (key: '+bk+')...','info');
    var sb=await fetchAll(c.sbUrl,c.sbKey,t);
    var d1=await fetchAll(c.cfUrl,c.cfKey,t);
    var d1k={};d1.forEach(function(r){if(r[bk])d1k[String(r[bk])]=1;});
    var miss=sb.filter(function(r){return r[bk]&&!d1k[String(r[bk])];});
    log('  SB: '+sb.length+' | D1: '+d1.length+' | ขาด: '+miss.length+(miss.length>0?' ⚠️':' ✅'),'ok');
    pb(5+(i+1)/tables.length*30);
  }
  log('✅ ตรวจสอบเสร็จ','ok');pb(100);
}

// ============ ซิงค์สถานะ Flash (ใช้ /api/batch-update) ============
async function syncFlashStatus(){
  var c=cfg();log('🚚 เริ่มซิงค์สถานะ Flash...','info');pb(5);

  // Test worker health
  try{
    var h=await fetch(c.cfUrl+'/api/health').then(function(r){return r.json();});
    if(!h.ok)throw new Error('Worker ไม่ตอบ');
    log('✅ Worker OK','ok');
  }catch(e){log('❌ Worker error: '+e.message,'err');return;}

  // Sync orders flash status
  log('📥 ดึง orders จาก Supabase...','info');
  var sbOrders=await fetchAll(c.sbUrl,c.sbKey,'orders');
  var withTrack=sbOrders.filter(function(r){return r.tracking_no&&r.tracking_no.length>3;});
  log('📦 orders ที่มี tracking: '+withTrack.length,'info');

  var updated=0,batch=100;
  for(var i=0;i<withTrack.length;i+=batch){
    var chunk=withTrack.slice(i,i+batch);
    try{
      var r=await fetch(c.cfUrl+'/api/batch-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:'orders',rows:chunk})});
      if(r.ok){var res=await r.json();updated+=res.updated||0;}
      else{log('⚠️ batch orders '+r.status,'warn');}
    }catch(e){log('❌ '+e.message,'err');}
    var done=Math.min(i+batch,withTrack.length);
    if(done%500===0||done===withTrack.length)log('  ✅ orders '+done+'/'+withTrack.length+' (อัพเดต '+updated+')','ok');
    pb(10+(done/withTrack.length)*35);
  }

  // Sync parcel_checks
  log('📥 ดึง parcel_checks จาก Supabase...','info');
  var sbParcels=await fetchAll(c.sbUrl,c.sbKey,'parcel_checks');
  var parcelsTrack=sbParcels.filter(function(r){return r.tracking_no&&r.tracking_no.length>3;});
  log('📦 parcels ที่มี tracking: '+parcelsTrack.length,'info');

  var pUpdated=0;
  for(var i=0;i<parcelsTrack.length;i+=batch){
    var chunk=parcelsTrack.slice(i,i+batch);
    try{
      var r=await fetch(c.cfUrl+'/api/batch-update-parcels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:chunk})});
      if(r.ok){var res=await r.json();pUpdated+=res.updated||0;}
      else{log('⚠️ batch parcels '+r.status,'warn');}
    }catch(e){log('❌ '+e.message,'err');}
    var done=Math.min(i+batch,parcelsTrack.length);
    if(done%500===0||done===parcelsTrack.length)log('  ✅ parcels '+done+'/'+parcelsTrack.length+' (อัพเดต '+pUpdated+')','ok');
    pb(50+(done/parcelsTrack.length)*35);
  }

  pb(100);log('','');
  log('🎉 ซิงค์สถานะ Flash เสร็จ! orders '+updated+' + parcels '+pUpdated,'ok');
}

// ============ ซิงค์ Orders ที่หาย (เพิ่มใหม่) ============
async function syncMissingOrders(){
  var c=cfg();log('📦 หา orders ที่หายไป...','info');pb(5);

  var sb=await fetchAll(c.sbUrl,c.sbKey,'orders');
  log('  Supabase: '+sb.length,'info');pb(25);
  var d1=await fetchAll(c.cfUrl,c.cfKey,'orders');
  log('  D1: '+d1.length,'info');pb(45);

  var d1k={};d1.forEach(function(r){if(r.order_id)d1k[r.order_id]=1;});
  var missing=sb.filter(function(r){return r.order_id&&!d1k[r.order_id];});
  log('  ขาด: '+missing.length+' รายการ','warn');

  if(!missing.length){log('✅ ครบแล้ว!','ok');pb(100);return;}

  // Only keep columns that D1 has
  var COLS=['order_id','timestamp','mobile_no','name','address','sub_district','district','province','zip','customer_fb_line','sales_channel','sales_person','account_email','sale_price','cod','remark','status','tracking_no','flash_status','sort_code'];
  var done=0,fail=0;
  for(var i=0;i<missing.length;i++){
    var rec={};COLS.forEach(function(c2){if(missing[i][c2]!==undefined)rec[c2]=missing[i][c2];});
    try{
      var r=await fetch(c.cfUrl+'/rest/v1/orders',{method:'POST',headers:Object.assign({},hdr(c.cfKey),{Prefer:'return=minimal'}),body:JSON.stringify(rec)});
      if(r.ok){done++;}
      else{
        fail++;
        if(fail<=5){var t=await r.text();log('  ❌ '+rec.order_id+': '+r.status+' '+t.substring(0,120),'err');}
      }
    }catch(e){fail++;if(fail<=5)log('  ❌ '+e.message,'err');}
    if((i+1)%20===0||i===missing.length-1){
      pb(50+((i+1)/missing.length)*50);
      log('  📊 '+( i+1)+'/'+missing.length+' (สำเร็จ '+done+' ล้มเหลว '+fail+')','info');
    }
  }
  pb(100);log('✅ เพิ่ม orders: '+done+' สำเร็จ'+(fail>0?', ล้มเหลว '+fail:''),'ok');
}

// ============ ซิงค์ทั้งหมด ============
async function syncEverything(){
  $('log').innerHTML='';
  log('🔄 เริ่มซิงค์ทั้งหมด...','info');
  await syncMissingOrders();
  await syncFlashStatus();
  log('','');log('🎉 เสร็จทุกอย่าง!','ok');
}
</script>
</body>
</html>
